<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADEarn</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" >
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <!-- Toast -->
    <div id="message" class="message hidden"></div>

    <!-- Card -->
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <div class="logo-circle">
                <i class="fa-solid fa-coins"></i>
            </div>
            <h1>ADEarn</h1>
            <p>Watch Ads • Earn Money • Invite Friends</p>
        </div>
        <!-- ================= LOGIN ================= -->
        <div id="auth-section">
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" placeholder="Email">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Password">
                <i class="fa-solid fa-eye toggle-password" onclick="togglePassword()">
                </i>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-gift"></i>
                <input type="text" id="referralCode" placeholder="Invitation Code (Optional)">
            </div>
            <div class="buttons">
                <button class="login" onclick="login()">
                    Login
                </button>
                <button class="register" onclick="register()">
                    Register
                </button>
            </div>
            <div class="info">
                <div>
                    <i class="fa-solid fa-shield-halved"></i>
                    Firebase Secure
                </div>
                <div>
                    <i class="fa-solid fa-user-group"></i>
                    Trusted Platform
                </div>
            </div>
        </div>
        <!-- ================= DASHBOARD ================= -->
        <div id="dashboard" class="hidden">
            <h2>
                Welcome Back!
            </h2>
            <h3 id="userEmail" class="user-email"></h3>
            <div class="dashboard-card">
                <small>
                    Current Balance
                </small>
                <h1>
                    $
                    <span id="balance">
                        0
                    </span>
                </h1>
            </div>
            <div class="dashboard-card">
                <small>
                    Your Referral Code :
                </small>
                <div class="referral-box">
                  <h3 id="myReferral"></h3>
                  <button class="copy-btn" onclick="copyReferral()">
                    <i class="fa-solid fa-copy"></i>
                  </button>
                </div>
            </div>
            <div class="notice">
                Minimum Withdrawal : <strong>$100</strong>
            </div>
            <button class="ads-button" onclick="goToAds()">
                <i class="fa-solid fa-play"></i>
                Watch Ads
            </button>
            <button class="logout-button" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </button>
        </div>
        <!-- Footer -->
        <div class="footer">
            <p>Contact Support</p>
            <p>Telegram : <b>@ADEarnTeam</b></p>
        </div>
    </div>
    <script>
        function togglePassword() {
            const input = document.getElementById("password");
            const icon = document.querySelector(".toggle-password");
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            }
            else {
                input.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }
    </script>
    <script type="module" src="firebase.js"></script>
    <script type="module" src="script.js"></script>
    <script>  
      // Referral copy function
      function copyReferral() {
      const referralText = document.getElementById('myReferral').innerText;
      navigator.clipboard.writeText(referralText).then(() => {
       alert('Referral code copied to clipboard!');
      }).catch(err => {
        console.error('Failed to copy: ', err);
      });
      }
    </script>
</body>
</html>
